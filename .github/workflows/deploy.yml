name: Deploy to Private EC2
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Create deployment package
        run: |
          tar -czf deploy.tar.gz index.html

      - name: Deploy to private EC2 using SSM
        shell: bash
        run: |
          BASE64=$(base64 -w 0 deploy.tar.gz)

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"echo '$BASE64' | base64 -d > /tmp/deploy.tar.gz\",
              \"sudo rm -rf /var/www/html/*\",
              \"sudo tar -xzf /tmp/deploy.tar.gz -C /var/www/html\",
              \"sudo systemctl restart nginx\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

      - name: Health check
        run: |
          echo "Waiting for ALB..."
          sleep 10

          for i in {1..12}; do
            if curl -fsS "${{ secrets.ALB_URL }}"; then
              echo ""
              echo "Application is healthy!"
              exit 0
            fi

            echo "Health check attempt $i failed..."
            sleep 5
          done

          echo "Health check failed!"
          exit 1
